name: Sync original NCERT PDFs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-original-pdfs.yml"
      - "**/*.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover and download referenced NCERT PDFs
        shell: bash
        run: |
          set -u
          mkdir -p pdfs

          mapfile -t files < <(
            grep -RhoE --include='*.js' '[A-Za-z][A-Za-z0-9._()-]*[0-9][A-Za-z0-9._()-]*\.pdf' .               | sed -E 's/[[:space:]]*\([0-9]+\)(\.pdf)$/\1/I'               | sort -u
          )

          echo "Referenced PDF files: ${#files[@]}"
          failed=()

          for file in "${files[@]}"; do
            if [ -s "pdfs/$file" ] && [ "$(head -c 4 "pdfs/$file" 2>/dev/null || true)" = "%PDF" ]; then
              echo "Already present: $file"
              continue
            fi

            url="https://ncert.nic.in/textbook/pdf/$file"
            tmp="pdfs/$file.tmp"

            echo "Downloading $file"
            if curl --insecure --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180               --user-agent "Mozilla/5.0"               --header "Accept: application/pdf,*/*"               "$url" -o "$tmp"; then
              if [ "$(head -c 4 "$tmp" 2>/dev/null || true)" = "%PDF" ]; then
                mv "$tmp" "pdfs/$file"
              else
                echo "Not a valid PDF: $file"
                rm -f "$tmp"
                failed+=("$file")
              fi
            else
              echo "Could not download: $file"
              rm -f "$tmp"
              failed+=("$file")
            fi
          done

          echo "Local PDF count:"
          find pdfs -maxdepth 1 -type f -name "*.pdf" | wc -l

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Files unavailable from NCERT:"
            printf "%s\n" "${failed[@]}"
          fi

      - name: Commit mirrored PDFs to the site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "Sync original NCERT chapter PDFs"
          git pull --rebase origin main
          git push origin HEAD:main
