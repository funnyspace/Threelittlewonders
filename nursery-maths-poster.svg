<path d="M912 122Q957 74 994 92Q1045 74 1070 124" stroke="#36aaff" stroke-width="17" fill="none"/>
<rect x="168" y="12" width="781" height="176" rx="88" fill="white" stroke="#168ef4" stroke-width="7" filter="url(#shadow)"/>
<text x="558" y="79" text-anchor="middle" font-size="60" font-weight="900" fill="#ed2762" font-family="Arial, sans-serif">5 Learning Examples</text>
<text x="558" y="128" text-anchor="middle" font-size="30" font-weight="800" fill="#153b80" font-family="Arial, sans-serif">Numbers • Counting • Colours • Shapes</text>
<text x="558" y="164" text-anchor="middle" font-size="30" font-weight="800" fill="#153b80" font-family="Arial, sans-serif">Big / Small • More / Less</text>

<rect x="14" y="214" width="535" height="398" rx="30" fill="url(#pink)" stroke="#ff6b85" stroke-width="8"/>
<rect x="573" y="214" width="532" height="398" rx="30" fill="url(#gold)" stroke="#f8be00" stroke-width="8"/>
<circle cx="70" cy="272" r="38" fill="#e83655"/><text x="70" y="289" text-anchor="middle" fill="#fff" font-family="Arial" font-size="50" font-weight="900">1</text>
<text x="124" y="282" font-family="Arial" font-size="43" font-weight="900">Number Awareness</text>
<rect x="31" y="311" width="500" height="278" fill="white" rx="20"/>
<line x1="196" y1="320" x2="196" y2="572" stroke="#ffd6dc" stroke-width="3"/>
<line x1="362" y1="320" x2="362" y2="572" stroke="#ffd6dc" stroke-width="3"/>
