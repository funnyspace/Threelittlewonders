<text x="443" y="394" text-anchor="middle" font-family="Arial" font-size="81" font-weight="900" fill="#199c47">3</text>
<text x="113" y="502" font-size="85" text-anchor="middle">☀️</text><text x="279" y="502" font-size="64" text-anchor="middle">🐦🐦</text><text x="443" y="502" font-size="65" text-anchor="middle">🍎🍎🍎</text>
<text x="113" y="563" font-family="Arial" font-size="27" font-weight="800" text-anchor="middle">1 sun</text>
<text x="279" y="563" font-family="Arial" font-size="27" font-weight="800" text-anchor="middle">2 birds</text>
<text x="443" y="563" font-family="Arial" font-size="27" font-weight="800" text-anchor="middle">3 apples</text>

<circle cx="630" cy="272" r="38" fill="#f06a13"/><text x="630" y="289" text-anchor="middle" fill="#fff" font-family="Arial" font-size="50" font-weight="900">2</text>
