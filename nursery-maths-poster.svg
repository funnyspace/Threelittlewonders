<text x="838" y="516" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900">Count the stars:</text>
<text x="838" y="558" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#17265a">1, 2, 3, 4, 5</text>

<rect x="14" y="628" width="535" height="354" rx="30" fill="url(#lime)" stroke="#87dc5b" stroke-width="8"/>
<rect x="573" y="628" width="532" height="354" rx="30" fill="url(#lav)" stroke="#ac75e9" stroke-width="8"/>
