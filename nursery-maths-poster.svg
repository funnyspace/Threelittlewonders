<text x="124" y="695" font-family="Arial" font-size="43" font-weight="900">Colours</text>
<rect x="32" y="726" width="500" height="231" fill="white" rx="20"/>
<line x1="157" y1="737" x2="157" y2="940" stroke="#cceeff" stroke-width="3"/>
<line x1="282" y1="737" x2="282" y2="940" stroke="#cceeff" stroke-width="3"/>
<line x1="407" y1="737" x2="407" y2="940" stroke="#cceeff" stroke-width="3"/>
<circle cx="95" cy="805" r="46" fill="#f92d30" stroke="#b6000c" stroke-width="5"/>
<path d="M200 768L257 819L200 868L174 817Z" fill="#168cf0" stroke="#0a5bb9" stroke-width="4"/>
