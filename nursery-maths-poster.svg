<text x="95" y="927" fill="#b41622">Red</text><text x="219" y="927" fill="#136ac0">Blue</text>
<text x="345" y="927" fill="#bb8310">Yellow</text><text x="475" y="927" fill="#298723">Green</text>
</g>

<circle cx="630" cy="684" r="38" fill="#7d39d8"/><text x="630" y="702" text-anchor="middle" fill="white" font-family="Arial" font-size="49" font-weight="900">4</text>
<text x="687" y="695" font-family="Arial" font-size="43" font-weight="900">Shapes</text>
<rect x="588" y="726" width="500" height="231" fill="white" rx="20"/>
<circle cx="644" cy="814" r="43" fill="#fa3033" stroke="#d71b28" stroke-width="5"/>
<rect x="716" y="772" width="85" height="85" fill="#168bf2" stroke="#0964b8" stroke-width="5"/>
