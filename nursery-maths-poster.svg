<rect x="922" y="774" width="125" height="84" fill="#41cb2b" stroke="#178623" stroke-width="5"/>
<g font-family="Arial" font-size="24" font-weight="900" text-anchor="middle">
<text x="644" y="925">Circle</text><text x="760" y="925">Square</text>
<text x="849" y="925">Triangle</text><text x="986" y="925">Rectangle</text>
</g>

<rect x="14" y="999" width="1091" height="379" rx="30" fill="url(#blue)" stroke="#35c2f8" stroke-width="8"/>
<circle cx="72" cy="1057" r="40" fill="#087de0"/><text x="72" y="1076" text-anchor="middle" fill="white" font-family="Arial" font-size="53" font-weight="900">5</text>
<text x="138" y="1068" font-family="Arial" font-size="44" font-weight="900">Big / Small and More / Less</text>
<rect x="32" y="1101" width="1054" height="257" fill="white" rx="20"/>
<line x1="552" y1="1112" x2="552" y2="1343" stroke="#75d8fa" stroke-width="5" stroke-dasharray="10 9"/>
<text x="205" y="1232" text-anchor="middle" font-size="125">🐘</text><text x="430" y="1235" text-anchor="middle" font-size="80">🐭</text>
<text x="205" y="1322" font-family="Arial" font-size="42" font-weight="900" text-anchor="middle" fill="#197bba">Big</text>
<text x="430" y="1322" font-family="Arial" font-size="42" font-weight="900" text-anchor="middle" fill="#d5516a">Small</text>
<text x="696" y="1215" text-anchor="middle" font-size="53">🍬🍬🍬</text>
<text x="696" y="1273" text-anchor="middle" font-size="53">🍬🍬</text>
<text x="950" y="1233" text-anchor="middle" font-size="60">🍬🍬</text>
<text x="698" y="1322" font-family="Arial" font-size="42" font-weight="900" text-anchor="middle" fill="#2aa463">More</text>
<text x="951" y="1322" font-family="Arial" font-size="42" font-weight="900" text-anchor="middle" fill="#c64f8b">Less</text>
