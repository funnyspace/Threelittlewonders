<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
<title id="title">Five Early Mathematics Learning Examples</title>
<desc id="desc">Number awareness, counting five stars, four colours, four shapes, and big versus small and more versus less.</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#7bd8ff"/><stop offset="1" stop-color="#c4f6ff"/></linearGradient>
<linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ffe2ed"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0a1"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="lime" x2="1" y2="1"><stop stop-color="#c9ffc4"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="lav" x2="1" y2="1"><stop stop-color="#e3caff"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#c4f2ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".13"/></filter>
</defs>
<rect width="1120" height="1400" fill="#fffef8"/>
<rect width="1120" height="200" fill="url(#sky)"/>
